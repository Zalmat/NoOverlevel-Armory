name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          mkdir -p dist/NoOverlevel-Armory
          cp server-v8.py config.py armory6-v*.html start.bat README.md LICENSE dist/NoOverlevel-Armory/
          cd dist
          zip -r NoOverlevel-Armory-${{ github.ref_name }}.zip NoOverlevel-Armory

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NoOverlevel-Armory-${{ github.ref_name }}.zip
          generate_release_notes: true
